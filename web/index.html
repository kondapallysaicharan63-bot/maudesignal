<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // v2 layout pages have their own addresses (/chat/<id>, /signals/trend, ...). The built files are linked
      // relatively ("./assets/..."), so on such an address the base is set to the app's folder before anything loads.
      ;(function () {
        var m = /^(.*?\/)(chat|signals|devices|evidence|connect|workflow|thread|run|capture|pms-workflow|roi|investigate)(\/|$)/.exec(location.pathname)
        if (m) {
          var b = document.createElement('base')
          b.href = m[1]
          document.head.appendChild(b)
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>MaudeSignal workspace</title>
    <meta
      name="description"
      content="When a complaint arrives, MaudeSignal finds the matching FDA evidence in one question, prepares PMS evidence, and keeps every fact traceable for audit."
    />
    <script>
      // Apply the saved theme before first paint. "system" leaves data-theme unset so the
      // design-system tokens follow prefers-color-scheme.
      // High contrast, Black and Pink are offered by the v2 layout only, so they are applied only when v2 will load
      // (same rule as src/layoutFlag.ts); the classic layout never shows them, not even for one frame.
      try {
        var t = localStorage.getItem('ms-theme')
        var v2 = false
        try {
          var q = (new URLSearchParams(location.search).get('layout') || '').trim().toLowerCase()
          var dflt = '__MS_LAYOUT_DEFAULT__'.trim().toLowerCase()
          v2 = q === 'v2' || (q !== 'classic' && (/\/(chat|signals|devices|evidence|connect|workflow|thread|run|capture|pms-workflow|roi|investigate)(\/|$)/.test(location.pathname) || dflt === 'v2'))
        } catch (e) {}
        if (t === 'light' || t === 'dark' || (v2 && (t === 'contrast' || t === 'black' || t === 'pink')))
          document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
