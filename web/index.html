<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // v2 layout pages have their own addresses (/chat/<id>, /signals/trend, ...). The built files are linked
      // relatively ("./assets/..."), so on such an address the base is set to the app's folder before anything loads.
      ;(function () {
        var m = /^(.*?\/)(chat|signals|devices|evidence|connect|workflow|thread|run|capture)(\/|$)/.exec(location.pathname)
        if (m) {
          var b = document.createElement('base')
          b.href = m[1]
          document.head.appendChild(b)
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaudeSignal workspace</title>
    <meta
      name="description"
      content="Stored, gate-verified answers about FDA device adverse-event reports. Signals for a person to review; not medical advice."
    />
    <script>
      // Apply the saved theme before first paint. "system" leaves data-theme unset so the
      // design-system tokens follow prefers-color-scheme.
      try {
        var t = localStorage.getItem('ms-theme')
        if (t === 'light' || t === 'dark' || t === 'contrast' || t === 'black' || t === 'pink')
          document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
