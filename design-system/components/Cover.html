<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../maudesignal.css"><title>Cover</title>
<style>
html,body{margin:0;height:288px;overflow:hidden;background:var(--paper);padding:0}
.cv{position:relative;width:960px;height:288px}
.cv svg{position:absolute;left:0;top:0}
.ink{fill:var(--inverse)} .cob{fill:var(--accent)} .amb{fill:var(--warning-mark)} .sunk{fill:var(--surface-sunk)}
.arc{fill:none;stroke:var(--on-inverse);stroke-width:1.5;opacity:.5}
.rule{stroke:var(--rule-strong);stroke-width:1}
.name{position:absolute;left:40px;bottom:100px;max-width:440px;font:600 72px/.95 var(--font-serif);letter-spacing:-1.5px;color:var(--ink)}
.name em{font-style:italic;font-weight:400;color:var(--accent)}
.tag{position:absolute;left:40px;bottom:62px;max-width:440px;font:400 14px/1.4 var(--font-sans);color:var(--ink-3)}
</style></head><body><div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- blocks: inverse 264x232 (the hero tile), accent 168x112, warning-mark 80x104, surface-sunk 168x104; gaps space-4 (16) like the bento grid -->
<!-- arrangement: a bento cut of the overview: one large ink tile with satellites, flush to the top and right edges -->
<!-- pattern: the logo's signal arcs (literal motif), concentric semicircles at a space-6 (24px) pitch, inside the ink tile -->
<!-- steps: space-4 16 gaps, space-6 24 pitch; radius-md 8 on tiles that do not bleed -->
<rect class="ink" x="496" y="-8" width="264" height="232" rx="8"/>
<rect class="cob" x="776" y="-8" width="200" height="120" rx="8"/>
<rect class="sunk" x="776" y="128" width="200" height="96" rx="8"/>
<rect class="amb" x="496" y="240" width="96" height="64" rx="8"/>
<rect class="sunk" x="608" y="240" width="368" height="64" rx="8"/>
<g transform="translate(628 200)">
<path class="arc" d="M-24,0 A24,24 0 0,1 24,0"/><path class="arc" d="M-48,0 A48,48 0 0,1 48,0"/><path class="arc" d="M-72,0 A72,72 0 0,1 72,0"/><path class="arc" d="M-96,0 A96,96 0 0,1 96,0"/><path class="arc" d="M-120,0 A120,120 0 0,1 120,0"/>
</g>
</svg>
<div class="name">Maude<em>Signal</em></div>
<div class="tag">The overnight briefing on AI medical device safety signals.</div>
</div><div style="position:fixed;right:12px;bottom:12px;display:flex;gap:4px;font:600 12px system-ui;z-index:9"><button onclick="document.documentElement.dataset.theme='light'">Paper</button><button onclick="document.documentElement.dataset.theme='dark'">Night</button><button onclick="document.documentElement.dataset.theme='contrast'">Contrast</button></div>
</body></html>
