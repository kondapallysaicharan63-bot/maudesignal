<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../maudesignal.css"><title>Severity</title>
<style>body{padding:24px} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .stack{display:flex;flex-direction:column;gap:14px}</style>
</head><body>
<div class="stack"><div class="row"><span class="ms-sev ms-sev--high">High</span><span class="ms-sev ms-sev--medium">Medium</span><span class="ms-sev ms-sev--low">Low</span></div>
<div class="row"><span class="ms-badge ms-badge--high">H</span><span class="ms-badge ms-badge--medium">M</span><span class="ms-badge ms-badge--low">L</span><span class="ms-chip ms-chip--high"><span class="ms-i ms-i--fill" aria-hidden="true">error</span>Severity high</span><span class="ms-chip">False negative</span><span class="ms-chip ms-code" style="color:var(--ink-2)">QIH</span><span class="ms-chip ms-chip--ok"><span class="ms-i ms-i--fill" aria-hidden="true">verified</span>4/4 citations verified</span></div>
<div class="row"><span class="ms-verified"><span class="ms-i ms-i--fill" aria-hidden="true">check_circle</span>Verified</span></div></div>
<div style="position:fixed;right:12px;bottom:12px;display:flex;gap:4px;font:600 12px system-ui;z-index:9"><button onclick="document.documentElement.dataset.theme='light'">Paper</button><button onclick="document.documentElement.dataset.theme='dark'">Night</button><button onclick="document.documentElement.dataset.theme='contrast'">Contrast</button></div>
</body></html>
