# HACKATHON-BUILT — runs the Meta Model API smoke test with repository secrets.
# Secrets never leave GitHub: they are injected as env vars and never echoed.
name: Meta smoke test

on:
  workflow_dispatch:
  push:
    branches: [hackathon-copilot, hackathon-day2]
    paths:
      - "src/maudesignal/copilot/**"
      - "test_meta_connection.py"
      - ".github/workflows/meta-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Which secrets are present (names only)
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          for v in META_MODEL_API_KEY OPENFDA_API_KEY GROQ_API_KEY; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: MISSING"; fi
          done
      - name: Meta Model API smoke test (models.list + streaming)
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          META_MODEL_API_BASE_URL: https://api.meta.ai/v1
          META_MODEL_API_MODEL: muse-spark-1.3
        run: python test_meta_connection.py
