# HACKATHON-BUILT — record real Muse Spark weekly-investigator runs for the
# stored-first public demo. Spends Meta Model API credit, so it only runs when
# demo/INVESTIGATE_REQUEST changes (or by manual dispatch once on the default branch).
name: Record weekly investigator runs

on:
  workflow_dispatch:
  push:
    branches: [hackathon-day2]
    paths: ["demo/INVESTIGATE_REQUEST"]

permissions:
  contents: write

concurrency:
  group: investigator-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run the weekly investigator (key from secrets, never echoed)
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          META_MODEL_API_BASE_URL: https://api.meta.ai/v1
          META_MODEL_API_MODEL: muse-spark-1.3
        run: |
          codes="$(sed -n 's/^product_codes:[[:space:]]*//p' demo/INVESTIGATE_REQUEST | head -n1)"
          args=()
          if [ -z "$codes" ] || [ "$codes" = "flagged" ]; then
            args+=(--flagged)
          else
            for c in $codes; do args+=(--product-code "$c"); done
          fi
          python -m maudesignal.cli investigate "${args[@]}" --out-dir demo/investigations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-investigations
          path: demo/investigations/
          if-no-files-found: ignore
      - name: Commit investigations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p demo/investigations
          git add -A demo/investigations
          git diff --cached --quiet || git commit -m "chore(demo): record weekly investigator runs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
