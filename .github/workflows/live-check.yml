name: Live check (typed ask on the live site)

# Asks the two questions that failed on Nov 1 (and one more) of the deployed API the way a
# visitor does, then one question in a real browser. Prints HTTP status, latency, mode and tier,
# model, trace steps, tool calls and the answer text; never a key. Spends a few cents of Meta
# credit: one shared budget limits a run to $0.40 (scripts/release/budget.py, the class
# smoke.py uses; every call is held at the deployed API's $0.25 cap until its real cost is
# known). Runs on a push to a branch named live-check/** or by hand.
#
# Optional repository secret:
#   MAUDESIGNAL_ADMIN_KEY_SMOKE  the admin key, only to delete the TEST entries this run writes
#                                (same secret smoke.yml uses)

on:
  push:
    branches: ["live-check/**"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "API base URL"
        default: "https://maudesignal-api.vercel.app"
      web_url:
        description: "Web app URL"
        default: "https://maudesignal-app.vercel.app"

concurrency:
  group: live-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-check:
    name: Live check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: ${{ inputs.api_url || 'https://maudesignal-api.vercel.app' }}
      WEB_URL: ${{ inputs.web_url || 'https://maudesignal-app.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Playwright and Chromium
        run: |
          pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium
      - name: Live asks and one browser question (budget $0.40)
        env:
          MAUDESIGNAL_ADMIN_KEY_SMOKE: ${{ secrets.MAUDESIGNAL_ADMIN_KEY_SMOKE }}
        run: |
          python scripts/release/live_check.py --api "$API_URL" --web "$WEB_URL" \
            --max-usd 0.40 --out-dir live-check-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check
          path: live-check-out/
          retention-days: 14
          if-no-files-found: ignore
