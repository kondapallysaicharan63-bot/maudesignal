name: Release check

# Runs on a release branch (release/**) that combines the API branch and the web branch, and on
# demand. It decides whether the branch may be deployed: every job must pass. A required step
# that did not run counts as a failure. The merged report is uploaded as "release-report"
# (JSON + Markdown, real numbers from the run). How to read it: docs/hackathon/RELEASE_CHECKS.md.
#
# Costs: the python, web, api-contract and e2e jobs call no model and need no secret. The live job
# runs only when the branch name contains "live" and the repository secret META_MODEL_API_KEY
# exists; the app's own cap (MAUDESIGNAL_LIVE_DAILY_USD) is set to $0.60 there. That cap is a
# per-run ledger on a fresh directory of the local API in the job: it is separate from the
# deployed API's global ledger, which this job never touches. So the day's total is limited by the
# number of live attempts: the first step of the live job itself counts today's (UTC) live
# attempts through the GitHub API with GITHUB_TOKEN and fails before any paid step when this
# attempt would be the fourth. A re-run of the job or of failed jobs checks again.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests, gate, numbers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: |
          pip install -e ".[dev]"
      - name: ruff, black, mypy --strict, unit tests with a coverage floor, gate adversarial set, secret scan, quoted numbers, review findings
        run: python scripts/release/python_job.py --out-dir release-out --cov-floor 70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-report
          path: release-out/
          retention-days: 14

  web:
    name: Web (build, tests, audit, bundle scan)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: npm ci, build, test, audit (fails on high or critical), scan web/dist for keys
        run: python scripts/release/web_job.py --out-dir release-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-report
          path: release-out/
          retention-days: 14

  api-contract:
    name: API contract, security and injection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package and the API's own requirements
        run: |
          pip install -e ".[dev]"
          pip install -r api/requirements.txt "uvicorn==0.54.0"
      - name: Make test keys (random, in this job only) and start the API
        run: |
          python scripts/release/serve_api.py prepare --profile contract \
            --keys-file "$RUNNER_TEMP/keys.json" --env-file "$RUNNER_TEMP/api.env"
          set -a; . "$RUNNER_TEMP/api.env"; set +a
          nohup python -m uvicorn api.index:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/v1/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/v1/health
      - name: Contract, auth, rate limits, validation, CORS, uploads, feedback, injection (REST and MCP)
        run: |
          python scripts/release/api_contract.py --base http://127.0.0.1:8000 \
            --keys-file "$RUNNER_TEMP/keys.json" --api-log "$RUNNER_TEMP/api.log" \
            --origin http://127.0.0.1:4173 --out-dir release-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-report
          path: release-out/
          retention-days: 14

  e2e:
    name: Browser e2e (chromium, firefox, webkit; 1440 and 390; light and dark)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install Python packages and the three browsers
        run: |
          pip install -e ".[dev]"
          pip install -r api/requirements.txt "uvicorn==0.54.0" "playwright==1.63.0" "pillow==12.3.0"
          python -m playwright install --with-deps chromium firefox webkit
      - name: Install web packages and axe-core (accessibility scan)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund axe-core@4.10.2
      - name: "Start the API (real code, no Meta key - live questions answer from recordings)"
        run: |
          python scripts/release/serve_api.py prepare --profile e2e \
            --origin http://127.0.0.1:4173 \
            --keys-file "$RUNNER_TEMP/keys.json" --env-file "$RUNNER_TEMP/api.env"
          set -a; . "$RUNNER_TEMP/api.env"; set +a
          nohup python -m uvicorn api.index:app --host 127.0.0.1 --port 8001 \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/v1/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8001/v1/health
      - name: Build the web app against that API and serve it
        working-directory: web
        env:
          VITE_MAUDESIGNAL_API_BASE: http://127.0.0.1:8001
        run: |
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort \
            > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
      - name: Browser checks (scenarios, error states, axe-core)
        run: |
          python scripts/release/e2e_web.py --url http://127.0.0.1:4173 \
            --api http://127.0.0.1:8001 --axe web/node_modules/axe-core/axe.min.js \
            --out-dir release-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: release-out/
          retention-days: 14

  live:
    name: Live (real Muse calls, total cost at most $0.60)
    # runs only on a branch whose name contains "live"; the secret cannot be read in an `if`, so
    # the first step checks it. One live job at a time across all branches (no overlap).
    if: contains(github.ref_name, 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-live
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Daily guard (first step, before any paid step)
        env:
          HAS_KEY: ${{ secrets.META_MODEL_API_KEY != '' }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MAX_LIVE_RUNS_PER_DAY: "3"
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::live job: the Meta key secret is not set, so nothing is run (never a pass)"
            exit 1
          fi
          # Every attempt (including "Re-run all jobs" and "Re-run failed jobs") gets a fresh
          # runner and a fresh $0.60 ledger, so the number of live attempts per day limits the
          # total. Sum run_attempt over today's (UTC) runs of this workflow on branches containing
          # 'live', over every page of results; for this run only the attempts before this one
          # count, and this attempt is the one being checked. A re-run checks again.
          today=$(date -u +%Y-%m-%d)
          total=0
          page=1
          while :; do
            runs=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/release-check.yml/runs?created=%3E%3D$today&per_page=100&page=$page") || {
                echo "::error::live job: stopped, today's runs could not be listed (no guess is made)"
                exit 1
              }
            n=$(echo "$runs" | python3 -c "
          import json, os, sys
          me = int(os.environ['RUN_ID'])
          runs = json.load(sys.stdin).get('workflow_runs', [])
          live = [r for r in runs if 'live' in (r.get('head_branch') or '').lower()]
          # other runs: all their attempts; this run: only the attempts before this one
          print(len(runs), sum((int(os.environ['RUN_ATTEMPT']) - 1) if r.get('id') == me else int(r.get('run_attempt') or 1) for r in live))
          ") || {
                echo "::error::live job: stopped, the run list could not be read (no guess is made)"
                exit 1
              }
            count=${n% *}
            attempts=${n#* }
            total=$((total + attempts))
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
            [ "$page" -gt 20 ] && break
          done
          this_attempt=$((total + 1))
          if [ "$this_attempt" -gt "$MAX_LIVE_RUNS_PER_DAY" ]; then
            echo "::error::live job: stopped before any paid step, this would be live attempt $this_attempt today (limit $MAX_LIVE_RUNS_PER_DAY)"
            exit 1
          fi
          echo "live job: will run (attempt $this_attempt of at most $MAX_LIVE_RUNS_PER_DAY today, UTC)"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package and the API's own requirements
        run: |
          pip install -e ".[dev]"
          pip install -r api/requirements.txt "uvicorn==0.54.0"
      - name: Start the API with the real Meta key and the app's own $0.60 cap, on a fresh ledger
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          MAUDESIGNAL_LIVE_DAILY_USD: "0.60"
          MAUDESIGNAL_LIVE_ASK_USD: "0.12"
          MAUDESIGNAL_LIVE_VOICE_USD: "0.12"
          MAUDESIGNAL_LIVE_LABEL_USD: "0.15"
        run: |
          python scripts/release/serve_api.py prepare --profile e2e \
            --keys-file "$RUNNER_TEMP/keys.json" --env-file "$RUNNER_TEMP/api.env" \
            --ledger-dir "$RUNNER_TEMP/live-ledger-$GITHUB_RUN_ID"
          set -a; . "$RUNNER_TEMP/api.env"; set +a
          nohup python -m uvicorn api.index:app --host 127.0.0.1 --port 8002 \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8002/v1/health > /dev/null && break
            sleep 1
          done
      - name: One chat question with history, one voice clip, one label photo, one injection question
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
        run: python scripts/release/live_check.py --base http://127.0.0.1:8002 --out-dir release-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-report
          path: release-out/
          retention-days: 14

  report:
    name: Release report
    needs: [python, web, api-contract, e2e, live]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: "*-report"
          merge-multiple: true
      - name: Merge the job reports
        env:
          NEEDS: ${{ toJSON(needs) }}
          LIVE_RESULT: ${{ needs.live.result }}
        run: |
          mkdir -p release-out
          cp -r parts/screenshots release-out/ 2>/dev/null || true
          inputs="parts/python-job.json parts/web-job.json parts/api-contract.json parts/e2e.json"
          if [ ! -f parts/live-check.json ] && [ "$LIVE_RESULT" = "skipped" ]; then
            # a skipped live job gets its own line in the report: not run, never a pass
            python - <<'PYEOF'
          import sys
          sys.path.insert(0, "scripts/release")
          from pathlib import Path
          from report import NOT_PRESENT, Report
          rep = Report("live job")
          rep.add("live job", NOT_PRESENT,
                  "not run: it needs a branch name containing 'live' (and, inside the job, the Meta key secret and at most 3 live attempts today)",
                  group="live", required=False)
          rep.write(Path("parts"), "live-check")
          PYEOF
          fi
          if [ -f parts/live-check.json ]; then inputs="$inputs parts/live-check.json"; fi
          python scripts/release/report.py merge $inputs \
            --json release-out/release-report.json --md release-out/release-report.md \
            --title "release-report ${GITHUB_REF_NAME}@${GITHUB_SHA::7}" || echo "MERGED_FAIL=1" >> "$GITHUB_ENV"
          cat release-out/release-report.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items()
                 if k != "live" and v["result"] != "success"}
          live = needs["live"]["result"]
          if live not in ("success", "skipped"):
              bad["live"] = live
          if bad:
              print("jobs that did not succeed:", bad)
              open(os.environ["GITHUB_ENV"], "a").write("JOB_FAIL=1\n")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-report
          path: |
            release-out/release-report.json
            release-out/release-report.md
          retention-days: 30
      - name: Fail unless every required job passed and the merged verdict is not FAIL
        run: |
          if [ "${MERGED_FAIL:-0}" = "1" ] || [ "${JOB_FAIL:-0}" = "1" ]; then
            echo "release check FAILED (see release-report.md)"; exit 1
          fi
          echo "release check: no failure (a BLOCKED verdict, if any, is listed in the report)"
