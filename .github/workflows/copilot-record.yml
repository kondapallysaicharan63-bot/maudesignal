# HACKATHON-BUILT — record real Muse Spark copilot transcripts for the
# stored-first public demo. Spends Meta Model API credit, so it only runs when
# demo/RECORD_REQUEST changes (or by manual dispatch once on the default branch).
name: Record copilot transcripts

on:
  workflow_dispatch:
  push:
    branches: [hackathon-copilot, hackathon-day2]
    paths: ["demo/RECORD_REQUEST"]

permissions:
  contents: write

concurrency:
  group: copilot-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Record transcripts (key from secrets, never echoed)
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          META_MODEL_API_BASE_URL: https://api.meta.ai/v1
          META_MODEL_API_MODEL: muse-spark-1.3
        run: python scripts/record_demo_transcripts.py --out demo/transcripts
      - uses: actions/upload-artifact@v4
        with:
          name: copilot-transcripts
          path: demo/transcripts/
      - name: Commit transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/transcripts
          git diff --cached --quiet || git commit -m "chore(demo): record Muse Spark copilot transcripts"
          git push
