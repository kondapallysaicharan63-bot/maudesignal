name: Record live clips (demo video)

# Records the two live Muse Spark questions for the demo video, once each, on the live site,
# and judges each reply with live_check.py's rules. Two live asks, about $0.06.
# Runs only on a push to a branch named record/**.

on:
  push:
    branches: ["record/**"]

concurrency:
  group: live-check
  cancel-in-progress: false

permissions:
  contents: write  # only to push the recorded clips to a throwaway media/<run id> branch

jobs:
  record:
    name: Record clips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright, Chromium and ffmpeg
        run: |
          pip install "playwright==1.63.0"
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Record and judge the two live clips
        env:
          MAUDESIGNAL_ADMIN_KEY_SMOKE: ${{ secrets.MAUDESIGNAL_ADMIN_KEY_SMOKE }}
        run: |
          ONLY=$(cat .record-only 2>/dev/null || echo q1,q2,phone,label,mcp,tour)
          python scripts/release/record_live_clips.py --out-dir clips-out --only "$ONLY"
      - name: Convert clips to mp4
        if: always()
        run: |
          for f in clips-out/*.webm; do
            [ -f "$f" ] && ffmpeg -y -loglevel error -i "$f" -c:v libx264 -pix_fmt yuv420p \
              -crf 18 "${f%.webm}.mp4"
          done
          ls -la clips-out
      - name: Push the clips to a throwaway media branch (fetchable with git)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="media/${GITHUB_RUN_ID}"
          mkdir -p /tmp/m
          cp clips-out/*.mp4 clips-out/*.png clips-out/*.json /tmp/m/ 2>/dev/null || true
          cd /tmp/m
          git init -q -b "$B"
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "clips $GITHUB_RUN_ID"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$B:$B"
          echo "pushed $B"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-clips
          path: clips-out/
          retention-days: 14
